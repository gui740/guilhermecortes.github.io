<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  svg { display: block; }
</style></head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="config.js"></script>
<script src="narracao_tempos.js"></script>
<script src="lib/core.js"></script>
<script src="lib/components.js"></script>
<script src="lib/art.js"></script>
<script src="lib/art2.js"></script>
<script src="lib/props.js"></script>
<script>const SCENES = {};</script>
<script src="scenes/cena1.js"></script>
<script src="scenes/cena2.js"></script>
<script src="scenes/cena3.js"></script>
<script src="scenes/cena4.js"></script>
<script src="scenes/cena5.js"></script>
<script src="scenes/cena6.js"></script>
<script src="scenes/cena7.js"></script>
<script src="scenes/cena8.js"></script>
<script>
// Linha do tempo: cenas em sequência com transição de papel rasgando entre elas.
let stage, caption, built = {}, timeline = [], tears = {};
function startTimes() {
  let t = 0;
  timeline = CENAS.filter((c) => SCENES[c.id]).map((c) => { const o = { cfg: c, t0: t }; t += c.dur; return o; });
  window.TOTAL = t;
}
function sceneFor(cfg) {
  if (!built[cfg.id]) built[cfg.id] = SCENES[cfg.id](stage, cfg);
  return built[cfg.id];
}
// renderiza o instante t (s) do vídeo inteiro, ou de uma cena só (?cena=cena1)
window.renderFrame = function (t) {
  const only = new URLSearchParams(location.search).get("cena");
  const list = only ? timeline.filter((x) => x.cfg.id === only).map((x) => ({ ...x, t0: 0 })) : timeline;
  let leg = [];
  const visibles = [];
  list.forEach((item, i) => {
    // relógio da cena: começa quando o rasgo da cena anterior começa a revelá-la
    const pre = !only && i > 0 ? TRANSICAO : 0;
    const c = t - item.t0 + pre;
    const end = item.cfg.dur + pre;
    const sc = sceneFor(item.cfg);
    const next = list[i + 1];
    const visible = c >= 0 && c < end;
    sc.el.setAttribute("display", visible ? "inline" : "none");
    if (!visible) return;
    sc.update(c);
    const front = !next || c < end - TRANSICAO;   // a cena "da frente" é a que manda na legenda
    if (front || !leg.length) { leg = item.cfg.legendas; legT = c; }
    if (next) {
      if (!tears[item.cfg.id]) tears[item.cfg.id] = new TornTransition(stage, i + 1);
      tears[item.cfg.id].apply(sc.el, stage.root, K.clamp((c - (end - TRANSICAO)) / TRANSICAO));
    }
    visibles.push(sc.el);
  });
  // ordem de desenho: a cena que entra fica por baixo, a que sai (rasgando) por cima
  for (let k = visibles.length - 1; k >= 0; k--) stage.root.appendChild(visibles[k]);
  Object.values(tears).forEach((tr) => { if (tr.fiber.parentNode) { stage.root.appendChild(tr.shadow); stage.root.appendChild(tr.fiber); } });
  caption.update(typeof legT === "number" ? legT : 0, leg);
};
let legT = 0;
window.setup = async function () {
  await document.fonts.load('400 100px "Anton"');
  await document.fonts.load('900 100px "Montserrat"');
  await document.fonts.ready;
  stage = new Stage(document.getElementById("stage"), FORMATO.w, FORMATO.h);
  caption = new Caption(stage);
  startTimes();
  return { total: window.TOTAL, w: FORMATO.w, h: FORMATO.h, fps: FPS };
};
</script>
</body></html>
