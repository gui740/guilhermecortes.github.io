<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teodora · Reel</title>
<style>
  @font-face { font-family: "Playfair"; src: url("../assets/fonts/PlayfairDisplay.ttf"); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: "Playfair"; src: url("../assets/fonts/PlayfairDisplay-Italic.ttf"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "Garamond"; src: url("../assets/fonts/EBGaramond.ttf"); font-weight: 400 800; font-style: normal; }
  @font-face { font-family: "Garamond"; src: url("../assets/fonts/EBGaramond-Italic.ttf"); font-weight: 400 800; font-style: italic; }
  html, body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  canvas { width: 405px; height: 720px; background: #000; box-shadow: 0 0 0 1px #333; }
  body.render #ui { display: none; }
  body.render #wrap { padding: 0; }
  body.render canvas { width: 1080px; height: 1920px; box-shadow: none; }
  #ui { max-width: 360px; line-height: 1.5; }
  #ui input[type=range] { width: 100%; }
  .safe { color: #f88; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <b>Teodora · prévia</b><br>
    <button id="play">▶ tocar</button> <span id="tc">0.00 s</span><br>
    <input id="scrub" type="range" min="0" max="44.5" step="0.033" value="0"><br>
    <label><input id="guides" type="checkbox"> mostrar zonas seguras <span class="safe">(vermelho)</span></label><br>
    <label><input id="withAudio" type="checkbox" checked> tocar áudio (out/audio_mix.wav)</label>
    <p>Tempos: <code>src/timings.json</code>. Recarregue a página após editar.</p>
  </div>
</div>
<script src="reel.js"></script>
</body>
</html>
